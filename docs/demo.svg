<rect width="780" height="462" rx="10" fill="#18181b"/>
<circle cx="20" cy="18" r="6" fill="#f87171"/><circle cx="40" cy="18" r="6" fill="#fbbf24"/>
<circle cx="60" cy="18" r="6" fill="#4ade80"/>
<text x="390.0" y="22" text-anchor="middle" style="fill:#71717a;font-size:12px">mcp-store-tools --demo (Shopify sample store)</text>
<clipPath id="typing"><rect id="cmd" x="0" y="38" height="24" width="0"/></clipPath>
<text x="18" y="54" clip-path="url(#typing)"><tspan class="prompt">$ </tspan>uv run python examples/demo.py</text>
<text x="18" y="84" class="l0 call">&gt; search_products(query=&quot;shirt&quot;, max_price=45, in_stock_only=True)</text>
<text x="18" y="104" class="l1 ">  Men&#x27;s T-shirt          40.0 CAD     in stock</text>
<text x="18" y="124" class="l2 ">  Women&#x27;s T-shirt        40.0 CAD     in stock</text>
<text x="18" y="144" class="l3 ">  Workout Shirt          10.0 CAD     in stock</text>
<text x="18" y="164" class="l4 "></text>
<text x="18" y="184" class="l5 call">&gt; get_product(handle=&quot;men-t-shirt&quot;)</text>
<text x="18" y="204" class="l6 ">  Size: Small, Color: Green    40.0 CAD   in stock</text>
<text x="18" y="224" class="l7 ">  Size: Small, Color: Olive    40.0 CAD   in stock</text>
<text x="18" y="244" class="l8 ">  Size: Small, Color: Ocean    40.0 CAD   in stock</text>
<text x="18" y="264" class="l9 ">  Size: Small, Color: Purple   40.0 CAD   in stock</text>
<text x="18" y="284" class="l10 "></text>
<text x="18" y="304" class="l11 call">&gt; browse_products(sort=&quot;price_high_to_low&quot;, limit=3)</text>
<text x="18" y="324" class="l12 ">  Gray Leather Sneakers  1000.0 CAD</text>
<text x="18" y="344" class="l13 ">  Frontpack              200.0 CAD</text>
<text x="18" y="364" class="l14 ">  High Top Sneakers      180.0 CAD</text>
<text x="18" y="384" class="l15 "></text>
<text x="18" y="404" class="l16 call">&gt; get_policy(kind=&quot;refund&quot;)</text>
<text x="18" y="424" class="l17 ">  We have a 30-day return policy, which means you have 30 days after receiving...</text>
</svg>
