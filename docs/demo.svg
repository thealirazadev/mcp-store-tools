<rect width="780" height="522" rx="10" fill="#18181b"/>
<circle cx="20" cy="18" r="6" fill="#f87171"/><circle cx="40" cy="18" r="6" fill="#fbbf24"/>
<circle cx="60" cy="18" r="6" fill="#4ade80"/>
<text x="390.0" y="22" text-anchor="middle" style="fill:#71717a;font-size:12px">mcp-store-tools --demo (Shopify sample store)</text>
<clipPath id="typing"><rect id="cmd" x="0" y="38" height="24" width="0"/></clipPath>
<text x="18" y="54" clip-path="url(#typing)"><tspan class="prompt">$ </tspan>uv run python examples/demo.py</text>
<text x="18" y="84" class="l0 call">&gt; search_products(query=&quot;shirt&quot;, max_price=45, in_stock_only=True)</text>
<text x="18" y="104" class="l1 ">  Men&#x27;s T-shirt          40.0 CAD     in stock</text>
<text x="18" y="124" class="l2 ">  Women&#x27;s T-shirt        40.0 CAD     in stock</text>
<text x="18" y="144" class="l3 ">  Workout Shirt          10.0 CAD     in stock</text>
<text x="18" y="164" class="l4 "></text>
<text x="18" y="184" class="l5 call">&gt; get_product(handle=&quot;men-t-shirt&quot;)</text>
<text x="18" y="204" class="l6 ">  Size: Small, Color: Green    40.0 CAD   id 43696932126742</text>
<text x="18" y="224" class="l7 ">  Size: Small, Color: Olive    40.0 CAD   id 43695837839382</text>
<text x="18" y="244" class="l8 ">  Size: Small, Color: Ocean    40.0 CAD   id 43696932159510</text>
<text x="18" y="264" class="l9 "></text>
<text x="18" y="284" class="l10 call">&gt; get_recommendations(handle=&quot;men-t-shirt&quot;, kind=&quot;goes_with&quot;, limit=3)</text>
<text x="18" y="304" class="l11 ">  Hoodie                 90.0 CAD</text>
<text x="18" y="324" class="l12 ">  Men&#x27;s Crewneck         120.0 CAD</text>
<text x="18" y="344" class="l13 ">  Sweatpants             35.0 CAD to 42.0 CAD</text>
<text x="18" y="364" class="l14 "></text>
<text x="18" y="384" class="l15 call">&gt; build_cart_link(items=[{handle, variant_id: 43696932126742, quantity: 2}])</text>
<text x="18" y="404" class="l16 ">  https://demostore.hydrogen.mock.shop/cart/43696932126742:2</text>
<text x="18" y="424" class="l17 ">  subtotal 80.0 CAD (before shipping and taxes)</text>
<text x="18" y="444" class="l18 "></text>
<text x="18" y="464" class="l19 call">&gt; get_policy(kind=&quot;refund&quot;)</text>
<text x="18" y="484" class="l20 ">  We have a 30-day return policy, which means you have 30 days after receiving...</text>
