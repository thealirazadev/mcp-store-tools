[project]
name = "mcp-store-tools"
version = "0.4.0"
description = "MCP server that gives AI assistants read-only access to a Shopify store's catalog and policies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Raza" }]
keywords = ["mcp", "model-context-protocol", "shopify", "storefront-api", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]

dependencies = [
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/thealirazadev/mcp-store-tools"
Issues = "https://github.com/thealirazadev/mcp-store-tools/issues"
Changelog = "https://github.com/thealirazadev/mcp-store-tools/blob/main/CHANGELOG.md"

[project.scripts]
mcp-store-tools = "mcp_store_tools.server:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_store_tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["mcp_store_tools"]

[tool.coverage.report]
fail_under = 95
show_missing = true
