name: release

# Push a tag like v0.2.0 to publish: the wheel, sdist, and the skill ZIP (the file to upload to
# skill marketplaces) are attached to a GitHub release. PyPI publishing uses trusted publishing
# and runs only when the repository variable PUBLISH_PYPI is "true".
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"

      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest
      - name: Check the tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - run: cd skill && zip -r ../dist/shopify-store-assistant-skill.zip shopify-store-assistant
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: rm dist/*.zip
      - uses: pypa/gh-action-pypi-publish@release/v1
